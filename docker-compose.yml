services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: smart_dw_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: smart_dw
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql:/sql
      - ./data:/data
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data: