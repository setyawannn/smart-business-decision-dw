services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: smart_dw_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE is required}
      CLICKHOUSE_USER: ${CLICKHOUSE_SERVER_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_SERVER_PASSWORD:?CLICKHOUSE_SERVER_PASSWORD is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql:/sql
      - shared_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  pipeline:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: smart_dw_pipeline
    restart: "no"
    x-coolify:
      exclude_from_hc: true
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE is required}
      PIPELINE_INPUT_FILE: ${PIPELINE_INPUT_FILE:-amazon_sale_report.csv}
      PIPELINE_DEBUG_KEEPALIVE: ${PIPELINE_DEBUG_KEEPALIVE:-false}
      PIPELINE_AUTO_DOWNLOAD: ${PIPELINE_AUTO_DOWNLOAD:-true}
      PIPELINE_FORCE_DOWNLOAD: ${PIPELINE_FORCE_DOWNLOAD:-false}
      CLICKHOUSE_PIPELINE_USER: ${CLICKHOUSE_SERVER_USER:-default}
      CLICKHOUSE_PIPELINE_PASSWORD: ${CLICKHOUSE_SERVER_PASSWORD:?CLICKHOUSE_SERVER_PASSWORD is required}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-superset}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
      KAGGLE_DATASET: ${KAGGLE_DATASET:-thedevastator/unlock-profits-with-e-commerce-sales-data}
      KAGGLE_SOURCE_FILENAME: ${KAGGLE_SOURCE_FILENAME:-Amazon Sale Report.csv}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:?KAGGLE_USERNAME is required}
      KAGGLE_KEY: ${KAGGLE_KEY:?KAGGLE_KEY is required}
    volumes:
      - shared_data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
    command: >
      /bin/sh -c "
      python /app/etl/run_pipeline.py;
      rc=$$?;
      if [ $$rc -ne 0 ] && [ \"$${PIPELINE_DEBUG_KEEPALIVE}\" = \"true\" ]; then
        echo 'Pipeline failed; keeping container alive for Coolify debugging';
        tail -f /dev/null;
      fi;
      exit $$rc
      "

  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile
    container_name: smart_dw_superset
    restart: unless-stopped
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    env_file:
      - .env
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?SUPERSET_SECRET_KEY is required}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:?SUPERSET_ADMIN_USERNAME is required}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?SUPERSET_ADMIN_PASSWORD is required}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:?SUPERSET_ADMIN_EMAIL is required}
      SUPERSET_ADMIN_FIRSTNAME: ${SUPERSET_ADMIN_FIRSTNAME:-Smart}
      SUPERSET_ADMIN_LASTNAME: ${SUPERSET_ADMIN_LASTNAME:-DW}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT:-8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:?CLICKHOUSE_DATABASE is required}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-superset}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD is required}
    volumes:
      - ./superset/config/superset_config.py:/app/pythonpath/superset_config.py
      - ./superset/bootstrap:/app/bootstrap
      - superset_home:/app/superset_home
    depends_on:
      clickhouse:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    command: ["/bin/sh", "/app/bootstrap/start_superset.sh"]

volumes:
  clickhouse_data:
  superset_home:
  shared_data:
